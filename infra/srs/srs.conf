listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;
    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }
    publish {
        mr              off;
    }
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    1;
        hls_window      6;
        hls_cleanup     on;
        hls_dispose     30;
        hls_m3u8_file   live/[stream].m3u8;
        hls_ts_file     live/[stream]-[seq].ts;
    }
    dvr {
        enabled         on;
        dvr_path        ./objs/nginx/html/[app]/replays/[stream].[timestamp].flv;
        dvr_plan        session;
    }
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }
    http_hooks {
        enabled         on;
        on_publish      http://api:3000/api/media/hooks?secret=__HOOK_SECRET__;
        on_unpublish    http://api:3000/api/media/hooks?secret=__HOOK_SECRET__;
        on_dvr          http://api:3000/api/media/hooks?secret=__HOOK_SECRET__;
    }
}
